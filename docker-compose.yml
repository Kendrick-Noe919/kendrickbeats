services:
  postgres:
    image: postgres:16-alpine
    container_name: kendrick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kendrick
      POSTGRES_PASSWORD: kendrick_dev_password
      POSTGRES_DB: kendrick_beats
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kendrick -d kendrick_beats']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
